# ============================================
# CONFIGURACI�N H2 - BASE DE DATOS EMBEBIDA
# ============================================

# Deshabilitar modo web (para aplicaci�n de escritorio)
spring.main.web-application-type=none
spring.main.headless=false

# Configuraci�n H2 en memoria (datos se pierden al cerrar)
spring.datasource.url=jdbc:h2:mem:sistemaboletas;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuraci�n JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Deshabilitar consola H2
spring.h2.console.enabled=false

# Deshabilitar banner de Spring
spring.main.banner-mode=off

# Configuraci�n de logging
logging.level.root=WARN
logging.level.Proyecto.Sistema.de.boletas=INFO
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR

# Tiempo l�mite de reserva (horas)
reserva.tiempo-horas=24